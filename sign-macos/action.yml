name: Sign and notarize macOS binaries
description: >
  Signs Mach-O files with the Cyprus University of Technology Developer ID
  certificate and submits them to Apple's notary service.

# No `${{ }}` expression is ever interpolated into the text of a `run:`
# script. Everything a script needs arrives through `env:` and is read as a
# quoted shell variable, because `${{ }}` is a textual substitution performed
# before bash sees the line: a caller passing `paths: 'a";id;"'` would
# otherwise close the quote and run arbitrary commands in a step holding the
# signing identity and the notary key. This is the same rule the note at the
# top of stepss-java-ui's release.yml states, and it applies here for the
# same reason. Keep it that way when adding steps. `if:` conditions are
# expressions rather than script text and are not covered by this.

inputs:
  mode:
    description: >
      sign, notarize, sign-and-notarize, or close. `close` does nothing but
      remove the keychain, for a caller that opened one with keep-keychain.
    required: false
    default: sign-and-notarize
  paths:
    description: "Newline-separated Mach-O files. Empty leaves signing to the caller."
    required: false
    default: ""
  bundle:
    description: "A .dmg, .pkg or .app to staple after notarization."
    required: false
    default: ""
  entitlements:
    description: "Override the entitlements plist."
    required: false
    default: ""
  keep-keychain:
    description: >
      Leave the keychain in place for the rest of the job, so that a later
      step can use keychain-path. The caller must then close it, by invoking
      this action again with mode: close under `if: always()`.
    required: false
    default: "false"

outputs:
  keychain-path:
    description: "The temporary keychain, for tools that must be told where to look."
    value: ${{ steps.open.outputs.keychain }}
  identity:
    description: "SHA-1 of the resolved signing identity."
    value: ${{ steps.open.outputs.identity }}

runs:
  using: composite
  steps:
    - name: Preflight
      if: inputs.mode != 'close'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SIGN_NOTARIZE: ${{ inputs.mode == 'sign' && 'false' || 'true' }}
      run: bash "$ACTION_PATH/sign.sh" preflight

    - name: Open the keychain
      id: open
      if: inputs.mode != 'notarize' && inputs.mode != 'close'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        bash "$ACTION_PATH/sign.sh" keychain-open
        identity="$(bash "$ACTION_PATH/sign.sh" identity)"
        echo "identity=$identity" >> "$GITHUB_OUTPUT"
        echo "keychain=$RUNNER_TEMP/stepss-signing.keychain-db" >> "$GITHUB_OUTPUT"
        # The certificate is read back from the keychain rather than from the
        # PKCS#12, because the bundle's certificate bag is RC2-encrypted and
        # the macOS openssl is LibreSSL.
        not_after="$(security find-certificate -p -c "Developer ID Application" \
                     "$RUNNER_TEMP/stepss-signing.keychain-db" \
                     | openssl x509 -noout -enddate | cut -d= -f2)"
        bash "$ACTION_PATH/sign.sh" cert-expiry "$not_after"

    - name: Sign
      if: inputs.paths != '' && inputs.mode != 'notarize' && inputs.mode != 'close'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SIGN_ENTITLEMENTS: ${{ inputs.entitlements }}
        PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        # mapfile needs bash 4.0; the macOS runner's shell: bash is Apple's
        # stock /bin/bash 3.2.57, so the array is built with a read loop
        # instead.
        files=()
        while IFS= read -r f; do
          files+=("$f")
        done < <(printf '%s\n' "$PATHS" | sed '/^[[:space:]]*$/d')
        # A whitespace-only paths input passes this step's own `if:` guard
        # above but leaves $files empty. "${files[@]}" on a zero-element
        # array raises "unbound variable" under bash 3.2's `set -u` (fixed in
        # bash 4.4, which the runner's stock /bin/bash does not have), so the
        # count is checked before ever expanding the array: the empty branch
        # calls sign.sh with no file arguments, and sign.sh's own
        # `[ "$#" -gt 0 ]` check is what reports the empty input, not a
        # shell abort.
        if [ "${#files[@]}" -eq 0 ]; then
          bash "$ACTION_PATH/sign.sh" sign
        else
          bash "$ACTION_PATH/sign.sh" sign "${files[@]}"
          bash "$ACTION_PATH/sign.sh" verify "${files[@]}"
        fi

    - name: Notarize
      if: inputs.mode != 'sign' && inputs.mode != 'close'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PATHS: ${{ inputs.paths }}
        BUNDLE: ${{ inputs.bundle }}
      run: |
        set -euo pipefail
        if [ -n "$BUNDLE" ]; then
          bash "$ACTION_PATH/sign.sh" notarize "$BUNDLE"
          bash "$ACTION_PATH/sign.sh" staple "$BUNDLE"
          bash "$ACTION_PATH/sign.sh" assess "$BUNDLE"
        else
          # Same bash-3.2 constraints as the Sign step above: build the
          # array with a read loop rather than mapfile, and check its count
          # before expanding it. mode: notarize with both bundle and paths
          # left at their empty defaults reaches this branch with zero
          # elements; the empty branch below calls sign.sh with no file
          # arguments so that sign.sh's own message reports it, rather than
          # the shell aborting on "${files[@]}" unbound under set -u.
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(printf '%s\n' "$PATHS" | sed '/^[[:space:]]*$/d')
          if [ "${#files[@]}" -eq 0 ]; then
            bash "$ACTION_PATH/sign.sh" notarize
          else
            bash "$ACTION_PATH/sign.sh" notarize "${files[@]}"
            # Every file, not just the first. This used to pass
            # "${files[0]}", which left helios's libhelios_api.dylib and
            # ramses's ramses.so unassessed. sign.sh assess takes a list and
            # loops inside, so the shell here expands the array once, under
            # the same count guard, and no loop of its own is needed.
            bash "$ACTION_PATH/sign.sh" assess "${files[@]}"
          fi
        fi

    # This is NOT a post step, and it cannot be made one: `runs.post` is
    # available to JavaScript and Docker actions only, and a composite
    # action has no equivalent. Every step here runs inline inside the one
    # calling step, so this executes when the call returns, not when the job
    # ends. Do not "fix" it into a `post:`; it would be ignored, and the
    # keychain would outlive the job with the signing identity in it.
    #
    # That inline timing is why keep-keychain exists. A caller that needs the
    # keychain after the call returns, as stepss-java-ui does when it hands
    # keychain-path to jpackage's --mac-signing-keychain, sets
    # keep-keychain: true and is then responsible for calling this action
    # again with mode: close under `if: always()`. Without that input the
    # keychain was deleted before the calling workflow's next step could ever
    # see it, which made keychain-path an output naming a file that no longer
    # existed.
    #
    # mode: close always closes, whatever keep-keychain says, because that is
    # the entire purpose of the mode. sign.sh keychain-close succeeds when
    # there is no keychain to remove, which matters because the caller runs
    # this under `if: always()` and the failure may have come before one was
    # ever created.
    - name: Close the keychain
      if: always() && (inputs.mode == 'close' || inputs.keep-keychain != 'true')
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/sign.sh" keychain-close
